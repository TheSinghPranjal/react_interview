# Manual production deploy. workflow_dispatch only: the bump commit this job
# pushes to main must not start another deploy.
name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Play production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Current stable (3.47.9, and 3.44.x before it) moved
      # CupertinoPageTransitionsBuilder out of material.dart, so
      # lib/core/theme/app_theme.dart does not compile. 3.41.9 is the last
      # stable release that still exports it, and it matches this repo
      # (created with Flutter 3.41.5, Dart SDK constraint ^3.11.3).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # This repo has no release AdMob validation script. The build below does
      # not pass dart-defines or -PADMOB_APP_ID, so the bundle keeps Google's
      # test ad units and the test AdMob app id. See the README.

      - name: Bump pubspec build number
        id: bump
        run: python3 .github/scripts/bump_pubspec_build.py >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # flutter pub get may have rewritten pubspec.lock. Stage only the version file.
          git add -- pubspec.yaml
          python3 .github/scripts/assert_staged_only.py pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Check the tree is clean except flutter pub get output
        run: python3 .github/scripts/assert_clean_after_bump.py

      - name: Read applicationId
        id: package
        run: python3 .github/scripts/read_application_id.py >> "$GITHUB_OUTPUT"

      - name: Restore upload keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 .github/scripts/write_android_signing.py

      # This repository is public, so ubuntu-latest has 16 GB of RAM.
      # android/gradle.properties requests -Xmx8G, a 4G metaspace ceiling, and
      # 512m of code cache (12.5 GB if every ceiling is reached). That fits a
      # 16 GB runner, so this job does not rewrite the heap. Private
      # ubuntu-latest runners have 8 GB; if this repo is made private, cap
      # org.gradle.jvmargs in this job only and do not commit the change.

      - name: Build release app bundle
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name="${{ steps.bump.outputs.build_name }}" \
            --build-number="${{ steps.bump.outputs.build_number }}"

      - name: Verify bundle version, package, and signing
        env:
          EXPECTED_VERSION_CODE: ${{ steps.bump.outputs.build_number }}
          EXPECTED_VERSION_NAME: ${{ steps.bump.outputs.build_name }}
          EXPECTED_PACKAGE: ${{ steps.package.outputs.package_name }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"
          python3 .github/scripts/verify_release_bundle.py \
            --bundle "build/app/outputs/bundle/release/app-release.aab" \
            --bundletool "$RUNNER_TEMP/bundletool.jar" \
            --version-code "$EXPECTED_VERSION_CODE" \
            --version-name "$EXPECTED_VERSION_NAME" \
            --package "$EXPECTED_PACKAGE"

      - name: Upload to Play production
        id: upload
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ steps.package.outputs.package_name }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed

      - name: Note Play upload failure
        if: failure() && steps.upload.conclusion == 'failure'
        run: |
          set -euo pipefail
          msg='An upload failure can mean either (a) "The caller does not have permission": the Play service account has no release access to this app under Users and permissions in Play Console, or (b) a version code already on Play, in which case run again.'
          echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::$msg"
